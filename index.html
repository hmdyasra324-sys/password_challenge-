<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head> <meta name="hilltopads-site-verification" content="2149626b547997404fd8a0141568a77746795cb2" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="hilltopads-site-verification" content="2149626b547997404fd8a0141568a77746795cb2" />
    <title>لعبة تحدي كلمة السر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #e4e4e4;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #ddd;
        }
        button {
            background: #e43f5a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background: #d02f4c;
        }
        .message {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة تحدي كلمة السر</h1>
        <div id="stage-indicator" style="font-size: 14px; margin-bottom: 10px; color: #a0aec0;">مؤشر المرحلة</div>
        <div class="question-box" id="question-text">جاري تحميل السؤال...</div>
        <input type="text" id="user-answer" placeholder="اكتب الإجابة هنا...">
        <button onclick="checkAnswer()">تحقق من الإجابة</button>
        <div class="message" id="result-message"></div>
    </div>

    <script>
        // مصفوفة تحتوي على المراحل والأسئلة مقسمة
        const stages = [
            // المرحلة الأولى: فواكه وخضروات
            [
                { q: "من أنها فواكه صيفية لونها أحمر ويدوره صغيرة؟", a: "فراولة" },
                { q: "من أنها فواكه صيفية لونها أحمر من الداخل وأخضر من الخارج؟", a: "بطيخ" },
                { q: "هل يشملها الشرد؟", a: "موز" },
                { q: "فاكهة مختصرة تزرع على الأرض؟", a: "ليمون" },
                { q: "نوع حضيات مفيد جداً للبرد وشاي بيتاشين سي؟", a: "البرتقال" }
            ],
            // المرحلة الثانية: بلاد وعواصم
            [
                { q: "عاصمة عربية أسمى أم الدنيا؟", a: "القاهرة" },
                { q: "دولة عربية عاصمتها الرياض؟", a: "السعودية" },
                { q: "دولة عربية عاصمتها أبوظبي؟", a: "الإمارات" },
                { q: "دولة بيوبس؟", a: "تونس" },
                { q: "دولة عواصم التاريخ العريق؟", a: "فلسطين" }
            ],
            // المرحلة الثالثة: حيوانات الغابة
            [
                { q: "الحيوان غاوي يلعب معك الغابة؟", a: "أسد" },
                { q: "أطول دين في العالم بطينها؟", a: "جيرافور" },
                { q: "أضخم دين على وجه الأرض؟", a: "فيل" },
                { q: "حيوان سريع جداً من فصيلة السنوريات وله مناطق واسعة؟", a: "فهد" },
                { q: "حيوان مفترس مثل القطط الكبيرة ويعيش في الغابات؟", a: "نمر" }
            ],
            // المرحلة الرابعة: معلومات إسلامية ودينية
            [
                { q: "شهر عربي بعد أن يأتي رمضان؟", a: "شوال" },
                { q: "كم عدد سور القرآن الكريم؟", a: "114" },
                { q: "الصلاة التي تصلي بدون ركوع أو سجود؟", a: "صلاة الجنازة" },
                { q: "أبو بكر صديقنا، أول خلفاء الراشدين؟", a: "أبو بكر" },
                { q: "اسم السورة التي تسمى قلب القرآن؟", a: "يس" }
            ],
            // المرحلة الخامسة: جماد وأشياء عامة
            [
                { q: "جماد استخدمه لفتح الأبواب؟", a: "مفتاح" },
                { q: "هل هناك شيء تستخدمه لتنظيمه وتتعلمه في المعصم؟", a: "ساعة" },
                { q: "جهاز ذكي تمسكه في أيدينا اليوم؟", a: "موبايل" },
                { q: "وسيلة مواصلات تريد على تفاصيل حديدية؟", a: "قطار" },
                { q: "الأداة التي تستخدمها للكتابة على الورق؟", a: "قلم" }
            ]
        ];

        let currentStage = 0;
        let currentQuestion = 0;

        function loadQuestion() {
            if (currentStage < stages.length) {
                if (currentQuestion < stages[currentStage].length) {
                    document.getElementById("stage-indicator").innerText = `المرحلة ${currentStage + 1} - السؤال ${currentQuestion + 1}`;
                    document.getElementById("question-text").innerText = stages[currentStage][currentQuestion].q;
                    document.getElementById("user-answer").value = "";
                    document.getElementById("result-message").innerText = "";
                } else {
                    currentStage++;
                    currentQuestion = 0;
                    loadQuestion();
                }
            } else {
                document.getElementById("stage-indicator").innerText = "مبروك!";
                document.getElementById("question-text").innerText = "لقد أكملت جميع مراحل لعبة تحدي كلمة السر بنجاح!";
                document.getElementById("user-answer").style.display = "none";
                document.querySelector("button").style.display = "none";
            }
        }

        function checkAnswer() {
            const userAns = document.getElementById("user-answer").value.trim();
            const correctAns = stages[currentStage][currentQuestion].a;
            const msg = document.getElementById("result-message");

            if (userAns === correctAns) {
                msg.style.color = "#4ade80";
                msg.innerText = "إجابة صحيحة! أحسنت.";
                currentQuestion++;
                setTimeout(loadQuestion, 1200);
            } else {
                msg.style.color = "#f87171";
                msg.innerText = "إجابة خاطئة، حاول مرة أخرى.";
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
